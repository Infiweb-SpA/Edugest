{% extends 'base.html' %}

{% block title %}Nuevo Rol - Edugest{% endblock %}
{% block header_title %}Crear Nuevo Rol{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto space-y-6">

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
        <a href="{{ url_for('gestion_roles.listar') }}" class="text-sm text-indigo-600 hover:text-indigo-800 font-medium">
            ← Volver a Roles
        </a>

        <h3 class="text-lg font-bold text-gray-900 mt-4 mb-6">Nuevo Rol Personalizado</h3>

        <form method="POST" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ID Numérico del Rol <span class="text-red-500">*</span></label>
                <input type="number" name="role_id" required min="1"
                    placeholder="Ej: 7"
                    class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                <p class="text-xs text-gray-400 mt-1">Debe ser único. Los IDs 1 (Admin), 3 (Profesor), 6 (Apoderado) ya están en uso.</p>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nombre del Rol <span class="text-red-500">*</span></label>
                <input type="text" name="nombre" required
                    placeholder="Ej: Coordinador TIC, Inspector, Psicólogo..."
                    class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
            </div>

            <div class="flex justify-end space-x-2 pt-4">
                <a href="{{ url_for('gestion_roles.listar') }}"
                   class="px-4 py-2 text-sm font-medium text-gray-700 border border-gray-300 rounded-lg hover:bg-gray-50">
                    Cancelar
                </a>
                <button type="submit"
                    class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 shadow-sm cursor-pointer">
                    Crear y Configurar Permisos
                </button>
            </div>
        </form>
    </div>

</div>
{% endblock %}
