<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Edugest - Gestión Escolar{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-gray-900 font-sans antialiased min-h-screen flex items-center justify-center">

    <main class="w-full max-w-md px-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="mb-6 space-y-2">
            {% for category, message in messages %}
            <div class="px-4 py-3 rounded-lg text-sm font-semibold {{ 'bg-red-100 text-red-700 border border-red-200' if category == 'error' or category == 'danger' else 'bg-green-100 text-green-700 border border-green-200' }}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>

</body>

</html>
