{% extends 'base_public.html' %}

{% block title %}Login - Edugest{% endblock %}

{% block content %}
<div class="bg-white rounded-xl shadow-lg border border-gray-200 p-8">
    <div class="text-center mb-6">
        <span class="text-4xl">🎓</span>
        <h2 class="text-2xl font-bold text-gray-900 mt-2">Edugest</h2>
        <p class="text-sm text-gray-500">Sistema de Gestión Escolar</p>
    </div>
    <form method="POST" action="{{ url_for('admin.login') }}" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
            <input type="text" name="username" required 
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                   placeholder="Ingrese su usuario">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
            <input type="password" name="password" required 
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                   placeholder="Ingrese su contraseña">
        </div>
        <button type="submit" 
                class="w-full bg-indigo-600 text-white py-2 px-4 rounded-lg hover:bg-indigo-700 transition font-medium">
            Ingresar
        </button>
    </form>
    <div class="mt-4 text-center text-xs text-gray-400">
        <p>Usuario por defecto: admin / admin123</p>
    </div>
</div>
{% endblock %}
